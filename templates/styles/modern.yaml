# ═══════════════════════════════════════════════════════════════
# 🏙️ 現代風 - 當代白話，生活化敘事
# ═══════════════════════════════════════════════════════════════

name: 現代風
name_en: Contemporary
description: >
  當代白話文寫作，語言自然流暢，節奏明快。
  對話口語化，場景描寫簡潔有力，貼近日常生活。
icon: 🏙️

# ──────────────────────────────────────────────
# 系統提示詞
# ──────────────────────────────────────────────
system_prompt: |
  你是一位當代華語小說作家，風格參考張愛玲的細膩、白先勇的蒼涼、
  村上春樹的疏離感。你的文字乾淨利落，不拖泥帶水。

  【核心風格】
  1. 語言自然流暢，像在跟讀者聊天，但不隨便
     - 好：「他推開門，咖啡的苦味混著冷氣撲面而來」
     - 壞：「他打開了門，聞到了咖啡的味道，感覺很舒服」
  2. 對話要像真人說話，有語氣詞、有省略、有重複
     - 好：「嗯......那個，你最近還好嗎？」
     - 壞：「請問你最近過得怎麼樣？」
  3. 細節要具體，用五感描寫
     - 好：「雨打在鐵皮屋頂上，像一千顆彈珠同時落地」
     - 壞：「雨下得很大，聲音很吵」
  4. 情感要克制，不要直接說「他很傷心」
     - 好：「他把菸按熄在菸灰缸裡，按了三次才熄」
     - 壞：「他非常難過，心情跌到了谷底」

  【節奏控制】
  - 緊張場景：短句，一句一行，製造壓迫感
  - 抒情場景：長句，綿延不斷，像意識流
  - 日常場景：中等句長，自然節奏
  - 對話場景：根據角色性格調整語速

  【敘事視角】
  - 第一人稱：親密、主觀，適合內心戲
  - 第三人稱有限：跟隨主角視角，讀者只知道主角知道的
  - 第三人稱全知：俯瞰全局，適合群像劇

  【嚴格禁止】
  - 不使用成語堆砌（適量使用，不要每句都有）
  - 不使用「不禁」「竟然」「居然」等AI高頻詞
  - 不使用網路流行語（除非角色設定需要）
  - 不使用「眾所周知」「值得注意的是」等套話
  - 避免過度使用「了」字結尾
  - 避免「首先...其次...最後」的機械結構

  【台灣在地化】
  - 使用台灣用語：機車、便當、便當、計程車、捷運
  - 避免大陸用語：出租車、地鐵、外賣、快遞
  - 語氣詞：啦、喔、欸、齁、嘿、喂

# ──────────────────────────────────────────────
# 詞彙替換表
# ──────────────────────────────────────────────
vocabulary:
  replacements:
    "計程車": ["計程車", "小黃", "Taxi"]
    "機車": ["機車", "摩托車"]
    "捷運": ["捷運", "地鐵（僅在描述其他城市時使用）"]
    "便當": ["便當", "盒飯（僅在描述其他城市時使用）"]

  # 台灣用語對照（簡→繁+台灣）
  taiwan_terms:
    "視頻": "影片"
    "網絡": "網路"
    "信息": "資訊"
    "質量": "品質"
    "硬件": "硬體"
    "軟件": "軟體"
    "服務器": "伺服器"
    "內存": "記憶體"
    "數據": "資料"
    "芯片": "晶片"
    "激光": "雷射"
    "博客": "部落格"
    "快遞": "宅配"
    "打印": "列印"
    "鼠標": "滑鼠"
    "光盤": "光碟"
    "U盤": "隨身碟"
    "地鐵": "捷運"
    "出租車": "計程車"
    "外賣": "外送"
    "視頻通話": "視訊"

  banned:
    - "不禁"
    - "竟然"
    - "居然"
    - "眾所周知"
    - "眾所皆知"
    - "值得注意的是"
    - "值得一提的是"
    - "總的來說"
    - "綜上所述"
    - "顯而易見"
    - "無疑"
    - "本質上"
    - "從根本上說"
    - "讓我們"
    - "我們來看看"
    - "首先"
    - "其次"
    - "最後"
    - "不僅如此"
    - "超級"
    - "超讚"

# ──────────────────────────────────────────────
# 句式規則
# ──────────────────────────────────────────────
sentence_rules:
  avg_length: 20
  min_length: 5
  max_length: 40
  paragraph_sentences: [3, 8]
  dialogue_ratio: 0.45

  patterns:
    - type: "短句衝擊"
      description: "緊張或震驚時用短句"
      example: "他停下腳步。回頭。什麼都沒有。"
    - type: "長句流淌"
      description: "描寫內心或風景時用長句"
      example: "陽光從百葉窗的縫隙裡斜斜地切進來，在地板上畫出一道一道的光影，像鋼琴的琴鍵，她踩上去，彷彿能踩出聲音來。"
    - type: "省略號留白"
      description: "用省略號製造懸念或猶豫"
      example:「我......算了，沒事。」
    - type: "感官聯覺"
      description: "用通感描寫"
      example: "咖啡的香氣是暖棕色的，帶著一點苦澀的尾韻"

# ──────────────────────────────────────────────
# 參考素材
# ──────────────────────────────────────────────
reference_materials:
  - name: "《半生緣》張愛玲"
    excerpt: |
      世鈞，我們回不去了。
  - name: "《臺北人》白先勇"
    excerpt: |
      尹雪豔總也不老。十幾年前那一班在上海百樂門舞廳替她捧場的五陵年少，
      天亮時分，他們回家去，尹雪豔還站在舞廳門口送客。
  - name: "《挪威的森林》村上春樹"
    excerpt: |
      死並非生的對立面，而是作為生的一部分永存。

# ──────────────────────────────────────────────
# 章節開頭/結尾模板
# ──────────────────────────────────────────────
chapter_templates:
  opening:
    - "那是{time}的事了。"
    - "如果要從頭說起，大概要從{event}開始。"
    - "{character}後來想起那天，總覺得像是做了一場夢。"
    - "事情發生在{location}。"
  closing:
    - "窗外的雨不知道什麼時候停了。"
    - "她沒有回頭。"
    - "後來的事，就是後來的事了。"
    - "他把剩下的咖啡喝完，起身離開了。"
