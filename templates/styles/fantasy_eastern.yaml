# ═══════════════════════════════════════════════════════════════
# 🐉 東方奇幻 - 仙俠、修真、東方神話
# ═══════════════════════════════════════════════════════════════

name: 東方奇幻
name_en: Eastern Fantasy
description: >
  仙俠修真風格，融合道家、佛家、神話元素。
  修煉體系完整，法寶靈器多樣，三界六道為舞台。
icon: 🐉

# ──────────────────────────────────────────────
# 系統提示詞
# ──────────────────────────────────────────────
system_prompt: |
  你是一位仙俠小說作家，風格融合《誅仙》的蒼涼、
  《凡人修仙傳》的務實、《遮天》的宏大世界觀。
  你的文字有仙氣，但不空洞；有熱血，但不幼稚。

  【核心風格】
  1. 修煉體系要「完整」
     - 境界劃分要清晰（如：練氣→築基→金丹→元嬰→化神→渡劫→大乘）
     - 每個境界要有具體的特徵和能力
     - 突破要有條件和代價
     - 好：「他感覺丹田內的靈力如潮水般湧動，金丹表面出現了裂紋，
            這是即將碎丹成嬰的徵兆」
  2. 法寶靈器要有「靈性」
     - 法寶不是工具，是有靈性的存在
     - 法寶認主、成長、進化
     - 好：「這柄飛劍在他手中嗡嗡作響，劍身上的符文亮起，
            似乎在回應他的情緒」
  3. 世界觀要「宏大」
     - 三界六道：人界、仙界、魔界、冥界
     - 宗門勢力：正道、魔道、散修
     - 天材地寶：靈藥、礦脈、靈獸
  4. 情感要「超越生死」
     - 修仙者的愛情跨越千年
     - 師徒情誼重於泰山
     - 同門之義生死與共

  【修煉描寫規則】
  - 境界突破：要有具體的身體變化和感悟
  - 戰鬥場面：法術、法寶、神通的具體效果
  - 靈力運轉：經脈、丹田、神識的描寫
  - 渡劫場面：天劫的威勢和渡劫者的掙扎

  【嚴格禁止】
  - 不要讓主角「無敵」（要有成長過程）
  - 不要讓修煉「太容易」（要有代價）
  - 不要使用AI套話
  - 不要讓反派「太蠢」（要有智商）
  - 避免「首先...其次...最後」的機械結構
  - 避免過度使用「了」字結尾

  【台灣在地化】
  - 使用繁體中文
  - 仙俠專用詞彙保持傳統：靈氣、丹田、元嬰、渡劫

# ──────────────────────────────────────────────
# 詞彙替換表
# ──────────────────────────────────────────────
vocabulary:
  replacements:
    # 修煉相關
    "修煉": ["修煉", "修行", "參悟", "閉關"]
    "突破": ["突破", "晉升", "破境", "渡劫"]
    "靈力": ["靈力", "真元", "法力", "靈氣"]
    "法寶": ["法寶", "靈器", "仙器", "神器"]
    "丹藥": ["丹藥", "靈丹", "仙丹", "靈藥"]

    # 人物稱謂
    "前輩": ["前輩", "真人", "仙長", "道友"]
    "晚輩": ["晚輩", "弟子", "小輩"]
    "師兄": ["師兄", "師兄長"]
    "師姐": ["師姐", "師姐長"]

  banned:
    - "不禁"
    - "竟然"
    - "居然"
    - "眾所周知"
    - "值得注意的是"
    - "總的來說"
    - "綜上所述"
    - "顯而易見"
    - "無疑"
    - "超級"
    - "超讚"

# ──────────────────────────────────────────────
# 句式規則
# ──────────────────────────────────────────────
sentence_rules:
  avg_length: 25
  min_length: 8
  max_length: 50
  paragraph_sentences: [3, 8]
  dialogue_ratio: 0.35

  patterns:
    - type: "修煉描寫"
      description: "描寫修煉過程的身體變化"
      example: "他盤膝而坐，靈力沿著經脈緩緩運轉，每經過一個穴位，便發出淡淡的螢光。"
    - type: "法寶描寫"
      description: "描寫法寶的外觀和靈性"
      example: "這柄飛劍通體雪白，劍身上刻著九道符文，每一道都蘊含著不同的屬性之力。"
    - type: "戰鬥場面"
      description: "描寫法術對決的激烈"
      example: "他右手掐訣，一道青色劍氣從指尖射出，直取對方咽喉。對方冷笑一聲，祭出一面銅鏡，將劍氣盡數擋下。"
    - type: "渡劫場面"
      description: "描寫天劫的威勢"
      example: "九天之上，雷雲翻湧。一道粗如水桶的紫色天雷從雲層中劈下，帶著毀天滅地的威勢，直取他的天靈蓋。"

# ──────────────────────────────────────────────
# 參考素材
# ──────────────────────────────────────────────
reference_materials:
  - name: "《誅仙》蕭鼎"
    excerpt: |
      天地不仁，以萬物為芻狗。
      這句話，他記了一輩子。
  - name: "《凡人修仙傳》忘語"
    excerpt: |
      他是一個凡人，沒有靈根，沒有背景，沒有奇遇。
      但他有一顆不屈的心。
  - name: "《遮天》辰東"
    excerpt: |
      九龍拉棺，從星空深處飛來。
      這一幕，改變了他的一生。

# ──────────────────────────────────────────────
# 章節開頭/結尾模板
# ──────────────────────────────────────────────
chapter_templates:
  opening:
    - "修仙之路，逆天而行。{context}"
    - "{location}，靈氣濃郁。{context}"
    - "自從{event}之後，{character}便開始了他的修煉之路。"
    - "天地之間，有大道三千。{character}選擇的是——{dao}。"
  closing:
    - "修仙之路，還很漫長。"
    - "他抬起頭，看著滿天星辰，心中湧起一股豪情。"
    - "這一戰，讓他明白了一個道理：在這個世界上，強者為尊。"
    - "他閉上眼睛，繼續修煉。"
